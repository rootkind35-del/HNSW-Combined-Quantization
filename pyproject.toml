[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ann-data"
version = "0.1.0"
description = "Streaming Data Pipeline for 10M Vietnamese Text Corpus in ANN Research"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyvi>=0.1.1",
    "datasketch>=2.0.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
